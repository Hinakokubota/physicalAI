<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>調合AIロボット 解説動画（連続再生）</title>
<style>
  html, body { height: 100%; margin: 0; background: #01060f; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #01060f; opacity: 0; pointer-events: none; }
  iframe.on { opacity: 1; }
  #toast { position: fixed; left: 5%; bottom: 5%; padding: 6px 16px; border-radius: 999px; background: rgba(6,20,46,.92);
           border: 1px solid rgba(255,255,255,.4); color: #fff; font: 700 16px "BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;
           opacity: 0; transition: opacity .3s; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<iframe id="f0" tabindex="-1" title="解説動画"></iframe>
<iframe id="f1" tabindex="-1" title="解説動画（次の章）"></iframe>
<div id="toast"></div>
<script src="assets/narration-data.js"></script>
<script src="assets/narration-player.js"></script>
<script>
// Canvasの章とローカルMP3は、親プレイヤーの同じ時計を使用する。
window.PhysicalAI.startPlaylist([document.getElementById('f0'), document.getElementById('f1')]);
</script>
</body>
</html>
